name: Argon candidate image

on:
  push:
    tags: ['v*-argon.*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish candidate images after all checks pass'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/argon-ci.yml

  docker:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read image name and package version
        id: package
        run: |
          printf 'image=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          node -p '"version=" + require("./package.json").version' >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.package.outputs.image }}
          tags: |
            type=raw,value=${{ steps.package.outputs.version }}
            type=sha
            type=raw,value=candidate

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gemini-web
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ROTATOR_VERSION=${{ steps.package.outputs.version }}
            VCS_REF=${{ github.sha }}
            VCS_URL=${{ github.server_url }}/${{ github.repository }}
            SOURCE_STATE=clean
          cache-from: type=gha,scope=argon-release
          cache-to: type=gha,mode=max,scope=argon-release
